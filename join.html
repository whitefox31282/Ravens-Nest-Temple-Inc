<div class="pagehead">
  <p class="eyebrow">Join</p>
  <h1>Join the Nest.</h1>
  <p class="lead">Tell us who you are and what you can teach or want to learn. We'll reach out when gatherings are announced.</p>
</div>
<div class="wrap">
  <form class="joinform reveal" name="join" method="POST" action="thanks.html" data-netlify="true" netlify-honeypot="bot-field">
    <input type="hidden" name="form-name" value="join">
    <p class="hp"><label>Don't fill this out: <input name="bot-field"></label></p>
    <label>Your name<input type="text" name="name" required autocomplete="name"></label>
    <label>Email<input type="email" name="email" required autocomplete="email"></label>
    <label>I'd like to
      <select name="interest" required>
        <option value="" disabled selected>Choose one</option>
        <option>Learn a skill</option>
        <option>Teach a skill</option>
        <option>Visit or attend a gathering</option>
        <option>Volunteer and help build</option>
        <option>Just say hello</option>
      </select>
    </label>
    <label>Tell us about yourself<textarea name="message" placeholder="Your path, your skills, what you hope to find here..."></textarea></label>
    <label class="check"><input type="checkbox" name="consent" value="yes" required> I agree to be contacted by email about Raven's Nest Temple.</label>
    <button class="btn" type="submit">Send to the Nest</button>
  </form>
</div>
